[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1024

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
elysium_testnet = "https://testnet-rpc.elysium.kinetiq.xyz"
elysium = "${ELYSIUM_RPC}"
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"
